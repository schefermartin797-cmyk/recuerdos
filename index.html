<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#F3E9E1">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Recuerdos">
  <title>Recuerdos</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;600&family=DM+Sans:wght@400;500;600&family=Fraunces:opsz,wght@9..144,500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <!-- Pantalla de ingreso -->
  <main id="login" class="screen" hidden>
    <form id="loginForm" class="login-card">
      <p class="hand">nuestros</p>
      <h1>Recuerdos</h1>
      <label for="email">Email</label>
      <input id="email" type="email" autocomplete="username" required>
      <label for="password">Contraseña</label>
      <input id="password" type="password" autocomplete="current-password" required>
      <p id="loginError" class="error" role="alert"></p>
      <button type="submit" class="btn">Entrar</button>
    </form>
  </main>

  <!-- App -->
  <main id="app" class="screen" hidden>
    <header class="top">
      <div>
        <p class="hand">nuestros</p>
        <h1>Recuerdos</h1>
      </div>
      <button id="logout" class="icon-btn" aria-label="Cerrar sesión" title="Cerrar sesión">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/></svg>
      </button>
    </header>

    <p id="empty" class="empty" hidden>Todavía no hay fotos.<br>Tocá “Añadir foto” para subir la primera.</p>
    <section id="grid" class="grid" aria-label="Fotos"></section>

    <label class="fab">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
      Añadir foto
      <input id="picker" type="file" accept="image/*" multiple aria-label="Añadir foto">
    </label>
  </main>

  <!-- Hoja para subir -->
  <dialog id="uploadSheet" class="sheet">
    <h2>Subir fotos</h2>
    <div id="previews" class="previews"></div>
    <label for="caption" class="small">Texto para las polaroids (opcional)</label>
    <input id="caption" type="text" maxlength="40" placeholder="Ej: Domingo de sol">
    <p id="uploadStatus" class="small" role="status"></p>
    <div class="row">
      <button id="cancelUpload" class="btn ghost" type="button">Cancelar</button>
      <button id="confirmUpload" class="btn" type="button">Subir</button>
    </div>
  </dialog>

  <!-- Foto en grande -->
  <dialog id="viewer" class="viewer">
    <figure>
      <img id="viewerImg" alt="">
      <figcaption>
        <span id="viewerCaption" class="hand big"></span>
        <span id="viewerDate" class="small"></span>
      </figcaption>
    </figure>
    <div class="row">
      <button id="deletePhoto" class="btn ghost danger" type="button">Eliminar</button>
      <button id="closeViewer" class="btn" type="button">Cerrar</button>
    </div>
  </dialog>

  <script type="module" src="app.js"></script>
</body>
</html>
